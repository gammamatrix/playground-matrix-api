parameters:
  -
    in: path
    name: id
    required: true
    description: 'The ticket id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Ticket
  summary: 'Edit a ticket form.'
  operationId: edit_ticket
  responses:
    200:
      description: 'The edit ticket information.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/ticket.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
