parameters:
  -
    in: path
    name: id
    required: true
    description: 'The epic id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Epic
  summary: 'Edit a epic form.'
  operationId: edit_epic
  responses:
    200:
      description: 'The edit epic information.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/epic.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
