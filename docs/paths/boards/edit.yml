parameters:
  -
    in: path
    name: id
    required: true
    description: 'The board id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Board
  summary: 'Edit a board form.'
  operationId: edit_board
  responses:
    200:
      description: 'The edit board information.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/board.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
